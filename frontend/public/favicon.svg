<!--
  应用图标：一页文字（朱砂底 + 暖纸线），与 tokens.css 的色板同源。

  为什么要专门放一个文件而不是不管：
  index.html 里没有 <link rel="icon"> 时，Chrome 会自动去探 /favicon.ico，
  每次加载都留一条 404 控制台报错。那条报错不在 Playwright 的 response 事件里
  （浏览器自发的 favicon 请求不算页面网络），所以它**只**以控制台 error 的形式存在 ——
  留着不管，任何「控制台无报错」的检查都永远红着，最后只能被削弱。

  颜色是硬编码 hex：SVG 是独立资源，读不到应用 CSS 变量。
  改色板时这里要跟着改（tokens.css → --accent / --bg）。
  造型刻意只留三条线：16px 下再多细节都糊成一团。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI 小说生成器">
  <rect width="32" height="32" rx="7" fill="#bf3b26"/>
  <g fill="#f6f3ec">
    <rect x="8" y="9" width="16" height="2.6" rx="1.3"/>
    <rect x="8" y="15" width="16" height="2.6" rx="1.3"/>
    <rect x="8" y="21" width="9" height="2.6" rx="1.3"/>
  </g>
</svg>
