# backend/config/providers.yaml
#
# Provider 双轨隔离的默认配置（ADR-2026-10-12 第 2 步）。
#
# 优先级（低 → 高）：
#   1. 本文件（本目录就是 backend/config/providers.yaml）
#   2. .env 里的 WRITER_* / ASSISTANT_* / DISTILLER_* 环境变量覆盖同名字段
#   3. 运行时通过 routers/settings.py 的 PUT /api/settings/llm 热覆盖
#
# 设计原则：
# - writer 默认留空：原 Writer 路径继续走 llm_provider / *_api_key 等老字段，
#   不强行覆盖 b58c763 的行为。返回的字段全空 → 工厂会委托给 get_llm_provider()。
# - assistant 默认走 zhipu（GLM-4-Flash 永久免费不限 token；中文诊断稳）。
# - distiller 默认也走 zhipu，但 timeout 明显更大（长任务，见该块注释）。
# - max_tokens / timeout 独立可调，但 writer 的默认值与 Writer 路径保持一致，
#   避免 Assistant 与 Writer 体量差异被误读为「不同步」。
#
# 失败兜底：任何 provider 配置出错（缺 key / 模型下架 / 网络不可达），registry
# 只会让该 role 抛错，**绝不**串到另一个 role 的缓存或单例。

writer:
  provider: ""           # 空 = 委托给 get_llm_provider() 的原 Writer 单例
  api_key: ""
  base_url: ""
  model: ""
  # 单次生成的上限，单位是 **token**（不是字）。实测 glm-4-flash 中文约
  # 1.67 字/token：3000 字的段落约需 1800 token。原先写 2048 只剩 14% 余量，
  # 一旦模型写得稍长就被拦腰截断，而系统当时**根本不检查 finish_reason**
  # （provider.py 里出现 0 次），半截文字会被当完整段落直接落库。
  # 4096 ≈ 6800 字，对 3000 字目标有 2 倍以上余量。
  # 若把 project.generation_length 调到 6000 以上，请同步上调这里。
  # v2.19: 拉到 8192 (≈13600 字) 让智谱/Nemotron 真能写 6000+ 字段不再截断
  # 2026-11-07: 生成链路统一提到 65536。MiniMax M3.1-Flash-Preview 强制 adaptive
  # thinking，reasoning_content 会先吃掉 max_tokens：实测单章正文 2300–2600 字，
  # 推理 4.3–7.3 万字符，32768 档曾整章返回 0 字（finish_reason=length）。
  # 65536 档已实测 finish=stop、正文正常。131072 仅作脚本防御上限，未验证。
  # 非 MiniMax 渠道（如 glm-4-flash）若拒绝该值，用 WRITER_MAX_TOKENS 覆盖。
  max_tokens: 65536
  timeout: 120

assistant:
  provider: "zhipu"      # 默认走智谱 GLM（中文诊断 / 检索增强）
  api_key: ""            # 空时按 provider 渠道名去 settings 拿对应 *_api_key
  base_url: ""           # 空时同上
  model: "glm-4-flash"   # GLM-4-Flash 永久免费不限 token，国内低延迟
  max_tokens: 1024       # 诊断/检索回答通常比正文短
  timeout: 60            # 诊断路径必须快速失败，不允许长等

distiller:
  # 文风档案抽取专用角色。**不是**「蒸馏档位」——
  # 档位（full / balanced / fast）在 app/style/narrative.py，决定「抽多细」；
  # 本块决定「用哪个模型抽」。
  provider: "zhipu"      # 与 assistant 同渠道起步（免费档即可跑通）
  api_key: ""            # 空时按 provider 渠道名去 settings 拿对应 *_api_key
  base_url: ""           # 空时同上
  model: "glm-4-flash"
  # 一次要输出 11 个维度的规则 JSON 数组。2048 会让 JSON 被拦腰截断
  # （智谱 finish_reason=length），截断的 JSON 解析失败 → 该块所有维度归零，
  # 表现为 rejected 计数暴涨（雪中悍刀行 990 章实测 rejected=740，改 8192 后回落）。
  # 2026-11-07 从 8192 提到 32768（KG 抽取链路）：大奉 30 章三路对照里 deepseek 有
  # 16 章在 8192 处触顶、qwen 30/30 章触顶并有一章整章失败；单章 completion 峰值
  # 32,805 token（4 次尝试累计），单章输出文本最长 13,782 字，deepseek 的 reasoning
  # 占 completion 的 71%。32768 = 4× 旧上限、约为最长单章输出的 2 倍，给 reasoning
  # 留余量；调大后两路截断归零。实测 glm-4-flash 与 deepseek-v4.1-flash 均接受
  # 该值（finish=stop，不报错）。
  max_tokens: 32768
  # 长任务：一次读几十段语料再压缩，60s 会频繁超时。
  # 180s 是「能跑完一整卷」的量级；配 :free 档仍嫌慢就再往上调。
  timeout: 180
