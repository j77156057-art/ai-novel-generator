# backend/config/providers.yaml
#
# Provider 双轨隔离的默认配置（ADR-2026-10-12 第 2 步）。
#
# 优先级（低 → 高）：
#   1. 本文件（本目录就是 backend/config/providers.yaml）
#   2. .env 里的 WRITER_* / ASSISTANT_* / DISTILLER_* 环境变量覆盖同名字段
#   3. 运行时通过 routers/settings.py 的 PUT /api/settings/llm 热覆盖
#
# 设计原则：
# - writer 默认留空：原 Writer 路径继续走 llm_provider / *_api_key 等老字段，
#   不强行覆盖 b58c763 的行为。返回的字段全空 → 工厂会委托给 get_llm_provider()。
# - assistant 默认走 zhipu（GLM-4-Flash 永久免费不限 token；中文诊断稳）。
# - distiller 默认也走 zhipu，但 timeout 明显更大（长任务，见该块注释）。
# - max_tokens / timeout 独立可调，但 writer 的默认值与 Writer 路径保持一致，
#   避免 Assistant 与 Writer 体量差异被误读为「不同步」。
#
# 失败兜底：任何 provider 配置出错（缺 key / 模型下架 / 网络不可达），registry
# 只会让该 role 抛错，**绝不**串到另一个 role 的缓存或单例。

writer:
  provider: ""           # 空 = 委托给 get_llm_provider() 的原 Writer 单例
  api_key: ""
  base_url: ""
  model: ""
  # 单次生成的上限，单位是 **token**（不是字）。实测 glm-4-flash 中文约
  # 1.67 字/token：3000 字的段落约需 1800 token。原先写 2048 只剩 14% 余量，
  # 一旦模型写得稍长就被拦腰截断，而系统当时**根本不检查 finish_reason**
  # （provider.py 里出现 0 次），半截文字会被当完整段落直接落库。
  # 4096 ≈ 6800 字，对 3000 字目标有 2 倍以上余量。
  # 若把 project.generation_length 调到 6000 以上，请同步上调这里。
  # v2.19: 拉到 8192 (≈13600 字) 让智谱/Nemotron 真能写 6000+ 字段不再截断
  # 2026-11-07: 生成链路统一提到 65536。MiniMax M3.1-Flash-Preview 强制 adaptive
  # thinking，reasoning_content 会先吃掉 max_tokens：实测单章正文 2300–2600 字，
  # 推理 4.3–7.3 万字符，32768 档曾整章返回 0 字（finish_reason=length）。
  # 2026-11-15: 提到 131072。第 31 章实测 65536 被撞满（reasoning+正文共享预算，
  # finish_reason=length → 拦腰截断 → 失败重写 + 压缩，单章 900.1s，为正常章 2.8 倍）。
  # 官方文档：M3 家族上限 524288、推荐 131072（「因 length 中断请调高此值」）；
  # 本渠道探针实测 131072 被接受（finish=stop，2026-11-15）。正常章在 stop 前收尾，
  # 上限只影响尾部截断场景，不增加常规额度消耗。
  # 非 MiniMax 渠道（如 glm-4-flash）若拒绝该值，用 WRITER_MAX_TOKENS 覆盖。
  max_tokens: 131072
  # 2026-11-14：120 → 180，与流式 stream_timeout 同档。4000 字级单章实测
  # 一次生成就要 180s+（第 4 章流式首包 150s、正文 180s 才到齐），120s 的
  # 同步入口在长篇幅下属先天不可用：MiniMax 连续两次读到超时、零产出。
  timeout: 180

assistant:
  provider: "zhipu"      # 默认走智谱 GLM（中文诊断 / 检索增强）
  api_key: ""            # 空时按 provider 渠道名去 settings 拿对应 *_api_key
  base_url: ""           # 空时同上
  model: "glm-4-flash"   # GLM-4-Flash 永久免费不限 token，国内低延迟
  max_tokens: 1024       # 诊断/检索回答通常比正文短
  timeout: 60            # 诊断路径必须快速失败，不允许长等
  # 实测**不可用**于 function calling 的模型（逗号分隔）。
  # 来源：2026-11-14 最小探针（同一套线上渠道配置）。glm-z1-flash 在
  # `tool_choice=required + max_tokens=4096` 下返回 finish_reason=tool_calls
  # 但 tool_calls=[]，finish_reason 不可信，故按模型名排除。
  # glm-4.6 / glm-4.5-air 当时因账号欠额（HTTP 429 / code 1113）无法验证，不列入。
  tools_unsupported_models: "glm-z1-flash"

distiller:
  # 文风档案抽取专用角色。**不是**「蒸馏档位」——
  # 档位（full / balanced / fast）在 app/style/narrative.py，决定「抽多细」；
  # 本块决定「用哪个模型抽」。
  provider: "zhipu"      # 与 assistant 同渠道起步（免费档即可跑通）
  api_key: ""            # 空时按 provider 渠道名去 settings 拿对应 *_api_key
  base_url: ""           # 空时同上
  model: "glm-4-flash"
  # 一次要输出 11 个维度的规则 JSON 数组。2048 会让 JSON 被拦腰截断
  # （智谱 finish_reason=length），截断的 JSON 解析失败 → 该块所有维度归零，
  # 表现为 rejected 计数暴涨（雪中悍刀行 990 章实测 rejected=740，改 8192 后回落）。
  # 2026-11-07 从 8192 提到 32768（KG 抽取链路）：大奉 30 章三路对照里 deepseek 有
  # 16 章在 8192 处触顶、qwen 30/30 章触顶并有一章整章失败；单章 completion 峰值
  # 32,805 token（4 次尝试累计），单章输出文本最长 13,782 字，deepseek 的 reasoning
  # 占 completion 的 71%。32768 = 4× 旧上限、约为最长单章输出的 2 倍，给 reasoning
  # 留余量；调大后两路截断归零。实测 glm-4-flash 与 deepseek-v4.1-flash 均接受
  # 该值（finish=stop，不报错）。
  max_tokens: 32768
  # 长任务：一次读几十段语料再压缩，60s 会频繁超时。
  # 180s 是「能跑完一整卷」的量级；配 :free 档仍嫌慢就再往上调。
  timeout: 180

# ---------------------------------------------------------------------------
# opencode go（按量计费网关，OpenAI 兼容）
#
# 接入要点（缺一个就 403/400，2026-11-12 实测）：
#   base_url: https://opencode.ai/inference/go/openai/v1
#   api_key : 环境变量 OC_KEY（不写进本文件）
#   model   : deepseek-v4.1-flash（canonical deepseek/deepseek-v4.1-flash-1017）
#   必带 header：
#     User-Agent: <浏览器 UA>        # urllib 默认 UA 会被 Cloudflare 拦成 403 / error 1010
#     x-opencode-session: <任意串>   # 缺失直接 400 MissingSessionID
#   可选参数：reasoning_effort = low | high | max（low 实测 ~3s/次）
#   上限：context 1,000,000 tokens；max output 384,000 tokens
#   计价：输入 $0.15/M，输出 $0.6/M，缓存读 $0.003/M
#
# 代码侧默认值见 app/llm/provider.py 的 OpenCodeGoChatProvider（UA 与 session
# 已在类里内置，直接构造即可，不必手动加 header）。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# KG 批抽专用预算（与 writer 完全独立，不在三角色配置里）
#
# 为什么独立：抽取是「1 段正文 -> 一坨结构化 JSON」的秒级小任务，却复用了
# writer 的 provider 单例，于是继承 960s 总预算。agent_runs #205 连续 3 次
# 各烧满 960s 才报 The read operation timed out，整段失败耗时 48 分钟。
#
# total_timeout       单次 complete_message 总预算（含换模型/重试退避）。
#                     最坏总时长 = 3 次外层尝试 x 300s = 15 分钟。
# first_byte_timeout  首字节阶段上限：连上了但一个字节都不给时，2 分钟内
#                     判死，而不是等整份总预算耗尽。writer 不读这两个值。
#
# provider            抽取**独立渠道**（env KG_EXTRACT_PROVIDER 优先级更高）。
#   ""（默认）        跟随主渠道 llm_provider，现有行为零变化。
#   zhipu             抽取走智谱：key/base_url 取 zhipu_*，模型链取库里
#                     `llm.zhipu_models`（启动时加载），预算仍是 300/120。
#   其它任何非空值     **配置错误**，启动即报错——不静默回退主渠道，
#                     否则 zhiphu 这类笔误会被藏成「配置已生效」。
#   writer/正文生成不读本字段。
# ---------------------------------------------------------------------------
kg_extract:
  provider: ""
  # 自定义模型链（逗号分隔，**首选模型在首位**）。
  #   ""（默认）       用所选渠道自己的链（zhipu → settings.zhipu_models；
  #                    跟随主渠道 → 主渠道的 *_models）。
  #   非空             只覆盖 KG 抽取用的链，写正文的候选链（writer）不受影响。
  # 由「模型设置」页的 KG 抽取配置区写入库键 `kg_extract.models`，保存即热生效。
  models: ""
  total_timeout: 300
  first_byte_timeout: 120
