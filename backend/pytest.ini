[pytest]
# 跑在 backend/ 下时：直接复用项目根 tests/（单源真源在这里），
# 避免在 backend/tests/ 重复一份相同文件，也避免 shim 的 sys.path 抖动。
# pythonpath = .. 让 backend/ 自己作为 namespace package 可被 import（from app.xxx import）。
pythonpath = ..
testpaths = ../tests
addopts = -ra -q
markers =
    slow: 真实语料上的重型回归（数分钟）；pytest -m "not slow" 可跳过
