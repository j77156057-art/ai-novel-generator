[pytest]
# 项目根 pytest 配置：
# - 默认 `pytest -q` 命中项目根的 tests/ 目录（里面是 backend 单测的 shim 转发层）；
# - pythonpath = backend 让 `from app.xxx import` 在测试里直接可用。
# - 同时 `backend/tests/` 内有自己的 conftest.py，单独进 backend/ 跑也行。
#
# 老的 backend/test_*.py 与 worktrees/*/test_*.py 是独立运行的 shell 脚本式断言，
# 它们自己 sys.exit()，**不**进 pytest 收集——别把它们当 pytest 测试。
pythonpath = backend
testpaths = tests
addopts = -ra -q
markers =
    slow: 真实语料上的重型回归（数分钟）；pytest -m "not slow" 可跳过
