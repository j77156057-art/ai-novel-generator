[pytest]
# 项目根 pytest 配置：
# - 默认 `pytest -q` 命中 tests/ 与 backend/tests/ 两处（前者是 shim 转发层，
#   后者是 backend 单测本体）。
# - pythonpath = backend 让 `from app.xxx import` 在测试里直接可用。
# - `backend/tests/conftest.py` 负责两件事：导入期校验 DATABASE_URL 必须指向
#   临时库（否则直接拒绝启动，防连真实库）；用 collect_ignore 排除 25 个
#   「模块级 sys.exit() 脚本 + 0 用例空壳 + stress 压力脚本」，前者由
#   tests/test_legacy_script_suite.py 以子进程逐个执行（断言退出码 0）。
#
# 老的 backend/test_*.py 与 worktrees/*/test_*.py 是独立运行的 shell 脚本式断言，
# 它们自己 sys.exit()，**不**进 pytest 收集——别把它们当 pytest 测试。
pythonpath = backend
testpaths = tests backend/tests
addopts = -ra -q
markers =
    slow: 真实语料上的重型回归（数分钟）；pytest -m "not slow" 可跳过
