[pytest]
# 项目根 pytest 配置：
# - 默认 `pytest -q` 命中项目根的 tests/ 目录（里面是 backend 单测的 shim 转发层）；
# - pythonpath = backend 让 `from app.xxx import` 在测试里直接可用。
# - 同时 `backend/tests/` 内有自己的 conftest.py，单独进 backend/ 跑也行。
#
# 老的 backend/test_*.py 与 worktrees/*/test_*.py 是独立运行的 shell 脚本式断言，
# 它们自己 sys.exit()，**不**进 pytest 收集——别把它们当 pytest 测试。
pythonpath = backend
testpaths = tests
# ⚠️ 这里的 `-q` **已经**是安静模式了 —— **命令行不要再加一个 `-q`**：
# 两个叠起来变成 `-qq`，pytest 会**静默吞掉结尾的汇总行**
# （「1549 passed, 9 skipped in 123s」那种），日志里只剩一串点和 SKIPPED 列表。
# ⇒ 标准命令是 `python -m pytest tests/`（README 与 CI 都用这一条）。
# 这个 `-q` 还负责 `--collect-only` 的**逐文件计数**格式
# （`tests/test_x.py: 23`），tests/test_readme_test_count.py 靠它数用例。
addopts = -ra -q
markers =
    slow: 真实语料上的重型回归（数分钟）；pytest -m "not slow" 可跳过
